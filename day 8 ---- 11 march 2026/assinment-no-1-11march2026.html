<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>this is cards </title>
    <!-- card-1 styling sheet  -->
    <style>
        .card-1 {
            display: flex;
            justify-content: center;
            padding: 0px 0px 10px 0px;
            /* width: 300px; */
            /* display: grid ; */
            /* background-color: gold; */
            /* justify-items: center; */
            /* text-align: center; */
        }

        .card-1-flex {
            /* width: 300px; */
            /* background-color: aqua; */
        }

        .card-1-body {
            width: 300px;
            background-color: rgb(160, 224, 250);
            padding: 10px 12px 10px 10px;
            border-radius: 10px;
            line-height: 32px;
            box-shadow: 0px 0px 10px  rgb(63, 6, 6) ;
        }

        .heading1 {
            text-align: center;
        }

        .card-1-text-color {
            color: blue;
        }

        .card-1-text-area {
            width: 100%;
            border: 1.5px solid blue;
            border-radius: 3px;
            padding: 5px;
            /* width: 99%; */
        }

        .card-1-sumit {
            padding: 5px;
            border-radius: 5px;
            border: 1.5px solid blue;
            color: white;
            font-weight: 700;
            background-color: blue;
            padding: 10px 30px 10px 30px;
        }
    </style>
    <!-- card-2 styling sheet  -->
    <style>

    </style>
</head>

<body>
    <!-- card-1 HTML  -->
    <div class="card-1">
        <div class="card-1-flex">
            <h2 class="heading1"><a class="card-1-text-color" href="">Contact Me </a></h2>
            <div class="card-1-body">
                <div><label class="card-1-text-color" for="">Name:</label></div>
                <div><input class="card-1-text-area" type="text" placeholder="Your Name "></div>
                <div><label class="card-1-text-color" for="">Email:</label></div>
                <div><input class="card-1-text-area" type="text" placeholder=" your@gmail.com "></div>
                <div><label class="card-1-text-color" for="">Message:</label></div>
                <textarea class="card-1-text-area" name="" id=""></textarea>
                <div></div><button class=" card-1-sumit card-1-text-color" type="submit">Send Message </button>
            </div>
        </div>
    </div>
    <!-- card-2 HTML  -->
    <div class="card-2">


    </div>
</body>

</html>
