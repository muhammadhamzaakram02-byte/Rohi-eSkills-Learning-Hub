<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="cursor.css" />
  <title>Cursor - Why Choose Us</title>
</head>

<body>
  <main>
    <section class="why-choose bg-white py-20">
      <div class="max-w-7xl mx-auto px-4">
        <header class="why-choose__header">
          <h2 class="why-choose__title">Why Choose Us</h2>
        </header>

        <div class="why-choose__grid">
          <article class="why-choose__card">
            <div class="why-choose__icon"><i class="fas fa-truck"></i></div>
            <h3 class="why-choose__cardTitle">Free Shipping</h3>
            <p class="why-choose__cardText">On orders over $50</p>
          </article>

          <article class="why-choose__card">
            <div class="why-choose__icon"><i class="fas fa-rotate-left"></i></div>
            <h3 class="why-choose__cardTitle">Easy Returns</h3>
            <p class="why-choose__cardText">30-day return policy</p>
          </article>

          <article class="why-choose__card">
            <div class="why-choose__icon"><i class="fas fa-lock"></i></div>
            <h3 class="why-choose__cardTitle">Secure Payment</h3>
            <p class="why-choose__cardText">100% secure transactions</p>
          </article>

          <article class="why-choose__card">
            <div class="why-choose__icon"><i class="fas fa-headset"></i></div>
            <h3 class="why-choose__cardTitle">24/7 Support</h3>
            <p class="why-choose__cardText">Dedicated customer service</p>
          </article>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
