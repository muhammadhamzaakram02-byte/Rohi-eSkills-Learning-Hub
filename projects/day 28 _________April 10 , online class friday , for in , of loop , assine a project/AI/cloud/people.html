<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>ShopEase - Meet Our Leadership</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="people.css" />
</head>

<body class="bg-gray-50 py-20 px-4">

  <!-- Section Header -->
  <div class="text-center mb-14">
    <h2 class="section-title text-5xl font-bold mb-3">Meet Our Leadership</h2>
    <p class="text-gray-500 text-base font-medium ">The passionate people behind ShopEase</p>
  </div>

  <!-- Team Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-7 max-w-6xl mx-auto">

    <!-- Card 1 - Michael Chen -->
    <div class="leader-card rounded-2xl overflow-hidden relative cursor-pointer">
      <!-- Background Image Layer -->
      <div class="card-bg  absolute inset-0 z-0">
        <img
          src="https://images.unsplash.com/photo-1560250097-0b93528c311a?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80"
          alt="">
        <!-- Avatar Silhouette -->

      </div>

      <!-- Top Gradient Bar (hover) -->

      <!-- Info Overlay -->
      <div class="card-overlay absolute bottom-0 left-0 right-0 z-10 px-5 pb-4 pt-16">
        <p class="text-white font-bold text-base leading-tight mb-1">Michael Chen</p>
        <p class="text-white/70 text-xs mb-0 card-role">Founder & CEO</p>

        <!-- Social Icons -->
        <div class="social-icons flex gap-2 mt-3">
          <a href="#" class="social-btn linkedin-btn" title="LinkedIn">
            <i style="color: rgb(255, 255, 255);" class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="#" class="social-btn twitter-btn" title="Twitter / X">
            <i class="fa-brands fa-x-twitter" style="color: rgb(255, 255, 255);"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- Card 2 - Sarah Johnson -->
    <div class="leader-card rounded-2xl overflow-hidden relative cursor-pointer">
      <div class="card-bg absolute inset-0 z-0">
        <img
          src="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80"
          alt="">
      </div>
      <div class="top-bar absolute top-0 left-0 right-0 h-1 z-10 rounded-t-2xl"></div>
      <div class="card-overlay absolute bottom-0 left-0 right-0 z-10 px-5 pb-4 pt-16">
        <p class="text-white font-bold text-base leading-tight mb-1">Sarah Johnson</p>
        <p class="text-white/70 text-xs mb-0 card-role">Chief Operating Officer</p>
        <div class="social-icons flex gap-2 mt-3">
          <a href="#" class="social-btn linkedin-btn" title="LinkedIn">
            <i style="color: rgb(255, 255, 255);" class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="#" class="social-btn twitter-btn" title="Twitter / X">
            <i class="fa-brands fa-x-twitter" style="color: rgb(255, 255, 255);"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- Card 3 - David Kim -->
    <div class="leader-card rounded-2xl overflow-hidden relative cursor-pointer">
      <div class="card-bg bg-gradient-to-br from-gray-700 to-gray-950 absolute inset-0 z-0">
        <img
          src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80"
          alt="">

      </div>
      <div class="top-bar absolute top-0 left-0 right-0 h-1 z-10 rounded-t-2xl"></div>
      <div class="card-overlay absolute bottom-0 left-0 right-0 z-10 px-5 pb-4 pt-16">
        <p class="text-white font-bold text-base leading-tight mb-1">David Kim</p>
        <p class="text-white/70 text-xs mb-0 card-role">Chief Technology Officer</p>
        <div class="social-icons flex gap-2 mt-3">
          <a href="#" class="social-btn linkedin-btn" title="LinkedIn">
            <i style="color: rgb(255, 255, 255);" class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="#" class="social-btn twitter-btn" title="Twitter / X">
            <i class="fa-brands fa-x-twitter" style="color: rgb(255, 255, 255);"></i>
          </a>
        </div>
      </div>
    </div>

    <!-- Card 4 - Emily Rodriguez -->
    <div class="leader-card rounded-2xl overflow-hidden relative cursor-pointer">
      <div class="card-bg bg-gradient-to-br from-blue-gray-400 to-slate-500 absolute inset-0 z-0"
        style="background: linear-gradient(135deg, #b0bec5, #607d8b);">
        <img
          src="https://images.unsplash.com/photo-1580489944761-15a19d654956?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80"
          alt="">
      </div>
      <div class="top-bar absolute top-0 left-0 right-0 h-1 z-10 rounded-t-2xl"></div>
      <div class="card-overlay absolute bottom-0 left-0 right-0 z-10 px-5 pb-4 pt-16">
        <p class="text-white font-bold text-base leading-tight mb-1">Emily Rodriguez</p>
        <p class="text-white/70 text-xs mb-0 card-role">Chief Marketing Officer</p>
        <div class="social-icons flex gap-2 mt-3">
          <a href="#" class="social-btn linkedin-btn" title="LinkedIn">
            <i style="color: rgb(255, 255, 255);" class="fa-brands fa-linkedin-in"></i>
          </a>
          <a href="#" class="social-btn twitter-btn" title="Twitter / X">
            <i class="fa-brands fa-x-twitter" style="color: rgb(255, 255, 255);"></i>
          </a>
        </div>
      </div>
    </div>

  </div><!-- end grid -->

</body>

</html>
