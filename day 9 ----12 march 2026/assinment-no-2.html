<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background-image </title>
    <style>
        body {
            margin: 0px;
        }

        .backimage {
            background-image: url(day-9-college-image.avif);
            width: 100vw;
            height: 80vh;
            background-position: center;
            background-size: cover;
            margin-top: 10px;
            position: relative;
            /* display: flex; */
            /* flex-direction: column; */
            /* justify-content: center; */
            /* align-items: center; */
            /* filter: brightness(50%); */
            /* z-index: 0; */
        }

        .contant {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: absolute;
            z-index: 2;
            /* background-color: rgb(142, 100, 100); */

        }


        .opacity {
            background-color: black;
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.7;
            z-index: 1;
            /* opacity: 0.5; */
            /* top: 0px; */
        }

        .text-color {
            color: white;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .button {
            padding: 4px 15px 4px 15px;
            border-radius: 10px;
            font-weight: 100;
        }

        .button1 {
            background-color: blue;
            /* padding: 10px; */
        }

        .button2 {
            background-color: green;
        }
    </style>
</head>

<body>
    <div class="backimage">
        <div class="opacity"></div>
        <div class="contant">
            <h1 class="text-color ">welcome to engineer </h1>
            <h1 class="text-color ">college </h1>
            <p class="text-color ">Lorem, ipsum dolor sit amet consectetur adipisicing elit. Maiores, similique?</p>
            <div class="buttons">
                <div class="text-color button button1 ">Apply Now</div>
                <div class="text-color button button2 ">Explore Cources </div>
            </div>
        </div>
    </div>
</body>

</html>
